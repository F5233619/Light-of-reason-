<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نور العقل - الأسطورة النهائية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  html, body { overflow-x: hidden; }
  body {
    background: var(--bg1, #05010f);
    color: #f0e9ff; min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 15px; position: relative;
    transition: background 0.6s;
  }
  /* ثيمات الألوان */
  body.theme-royal { --bg1: #05010f; --accent1: #a855f7; --accent2: #fbbf24; --accent3: #ec4899; }
  body.theme-ocean { --bg1: #021420; --accent1: #06b6d4; --accent2: #10b981; --accent3: #3b82f6; }
  body.theme-sunset { --bg1: #1a0505; --accent1: #f97316; --accent2: #ec4899; --accent3: #fbbf24; }
  body.theme-forest { --bg1: #021a0a; --accent1: #10b981; --accent2: #84cc16; --accent3: #22d3ee; }
  body.theme-galaxy { --bg1: #0a0520; --accent1: #8b5cf6; --accent2: #22d3ee; --accent3: #f472b6; }

  body::before {
    content: ''; position: fixed; inset: -50%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--accent1, #a855f7) 35%, transparent), transparent 35%),
      radial-gradient(circle at 80% 20%, color-mix(in srgb, var(--accent3, #ec4899) 25%, transparent), transparent 35%),
      radial-gradient(circle at 50% 80%, color-mix(in srgb, var(--accent2, #22d3ee) 30%, transparent), transparent 40%);
    animation: aurora 20s ease-in-out infinite alternate;
  }
  @keyframes aurora {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .container {
    width: 100%; max-width: 850px; position: relative; z-index: 2;
    background: linear-gradient(145deg, rgba(30, 15, 60, 0.85), rgba(15, 5, 35, 0.92));
    border-radius: 32px; padding: 28px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(168, 85, 247, 0.4),
                0 0 80px rgba(168, 85, 247, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(25px);
    transition: all 0.4s;
  }

  h1 {
    text-align: center; font-size: 36px; margin-bottom: 8px;
    background: linear-gradient(90deg, #fbbf24, #f472b6, #a855f7, #22d3ee, #34d399, #fbbf24);
    background-size: 400% 100%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; animation: rainbowText 8s linear infinite;
    font-weight: 900; filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.6));
  }
  @keyframes rainbowText {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }
  .subtitle { text-align: center; color: #c4b5fd; font-size: 13px; margin-bottom: 20px; }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* اسم اللاعب */
  .player-input-wrap {
    text-align: center; margin-bottom: 20px;
  }
  .player-input-wrap label { color: #fbbf24; font-size: 14px; display: block; margin-bottom: 8px; font-weight: bold; }
  .player-input-wrap input {
    padding: 12px 20px; border-radius: 14px; border: 2px solid rgba(196, 181, 253, 0.4);
    background: rgba(76, 29, 149, 0.4); color: #fff; font-size: 16px;
    text-align: center; width: 250px; font-family: inherit;
    transition: all 0.3s;
  }
  .player-input-wrap input:focus {
    outline: none; border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
  }

  /* اللاعب XP */
  .player-xp {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 15px; background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(168, 85, 247, 0.15));
    border-radius: 14px; margin-bottom: 15px; font-size: 14px;
    border: 1px solid rgba(251, 191, 36, 0.3);
  }
  .player-xp .name { color: #fbbf24; font-weight: bold; }
  .player-xp .coins { color: #fbbf24; font-weight: bold; }
  .xp-bar {
    flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 8px;
    margin: 0 12px; overflow: hidden;
  }
  .xp-fill {
    height: 100%; background: linear-gradient(90deg, #fbbf24, #ec4899);
    border-radius: 8px; transition: width 0.5s;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.7);
  }

  .cat-title { color: #fbbf24; font-size: 17px; margin-bottom: 12px; font-weight: bold; text-align: center; }
  .category-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
  .cat-btn {
    padding: 22px 26px; font-size: 16px; border-radius: 22px; cursor: pointer;
    border: 2px solid; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    color: #fff; font-weight: bold; min-width: 190px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    position: relative; overflow: hidden; font-family: inherit;
  }
  .cat-btn::before {
    content: ''; position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.4), transparent 70%);
    transition: opacity 0.4s;
  }
  .cat-btn:hover::before { opacity: 1; }
  .cat-btn .icon { font-size: 42px; filter: drop-shadow(0 0 15px currentColor); }
  .cat-btn.religious {
    background: linear-gradient(135deg, #064e3b, #10b981, #34d399);
    border-color: #6ee7b7;
    box-shadow: 0 10px 40px rgba(16, 185, 129, 0.5);
  }
  .cat-btn.scientific {
    background: linear-gradient(135deg, #4c1d95, #7c3aed, #ec4899);
    border-color: #c4b5fd;
    box-shadow: 0 10px 40px rgba(124, 58, 237, 0.5);
  }
  .cat-btn:hover { transform: translateY(-8px) scale(1.05); }

  .diff-section { margin-top: 20px; text-align: center; }
  .diff-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .diff-btn {
    padding: 10px 18px; font-size: 14px; border-radius: 12px; cursor: pointer;
    border: 2px solid rgba(196, 181, 253, 0.4); background: rgba(76, 29, 149, 0.4);
    color: #e9d5ff; font-weight: bold; transition: all 0.3s; font-family: inherit;
  }
  .diff-btn:hover { transform: translateY(-3px); border-color: #fbbf24; }
  .diff-btn.active {
    background: linear-gradient(135deg, #fbbf24, #f472b6);
    color: #0a0620; border-color: #fbbf24;
    box-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
  }

  /* أزرار جانبية */
  .side-buttons {
    display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap;
  }
  .mini-btn {
    padding: 10px 16px; font-size: 13px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(196, 181, 253, 0.4); background: rgba(76, 29, 149, 0.4);
    color: #e9d5ff; font-weight: bold; transition: all 0.3s; font-family: inherit;
  }
  .mini-btn:hover { background: rgba(124, 58, 237, 0.6); transform: translateY(-2px); }

  /* لوحة الصدارة */
  .leaderboard {
    margin-top: 20px; padding: 16px; border-radius: 18px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(168, 85, 247, 0.1));
    border: 1px solid rgba(251, 191, 36, 0.3);
  }
  .leaderboard h3 { color: #fbbf24; margin-bottom: 12px; font-size: 16px; text-align: center; }
  .lb-row {
    display: flex; justify-content: space-between; padding: 8px 12px;
    border-radius: 10px; margin-bottom: 5px; font-size: 13px;
    background: rgba(255,255,255,0.03);
  }
  .lb-row.top1 { background: linear-gradient(90deg, rgba(251, 191, 36, 0.25), transparent); color: #fbbf24; font-weight: bold; }
  .lb-row.top2 { background: linear-gradient(90deg, rgba(192, 192, 192, 0.2), transparent); }
  .lb-row.top3 { background: linear-gradient(90deg, rgba(205, 127, 50, 0.2), transparent); }

  /* شريط الإحصائيات */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
  }
  .stat-box {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(34, 211, 238, 0.12));
    padding: 7px 13px; border-radius: 12px; font-size: 13px;
    border: 1px solid rgba(196, 181, 253, 0.3);
  }
  .stat-box span { color: #fbbf24; font-weight: bold; font-size: 15px; }
  .streak-box { background: linear-gradient(135deg, #f97316, #ef4444); border-color: #fbbf24; }
  .streak-box span { color: #fff !important; }
  .streak-box.hot { animation: streakFire 0.6s infinite; }
  @keyframes streakFire {
    0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(251, 146, 60, 0.6); }
    50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(251, 146, 60, 1); }
  }
  .surprise-box { background: linear-gradient(135deg, #fbbf24, #ec4899); animation: surpriseGlow 1s infinite; }
  .surprise-box span { color: #0a0620 !important; }
  @keyframes surpriseGlow {
    0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.6); }
    50% { box-shadow: 0 0 30px rgba(251, 191, 36, 1); }
  }

  .progress-bar {
    width: 100%; height: 10px; background: rgba(255,255,255,0.06);
    border-radius: 10px; overflow: hidden; margin-bottom: 12px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #22d3ee, #a855f7, #f472b6, #fbbf24);
    background-size: 300% 100%;
    transition: width 0.5s; border-radius: 10px;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .timer-container {
    display: flex; justify-content: center; align-items: center;
    margin: 5px auto 12px; width: 80px; height: 80px; position: relative;
  }
  .timer-svg { transform: rotate(-90deg); width: 80px; height: 80px; }
  .timer-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 6; }
  .timer-fg {
    fill: none; stroke: url(#timerGradient); stroke-width: 6;
    stroke-linecap: round; transition: stroke-dashoffset 1s linear;
  }
  .timer-text {
    position: absolute; inset: 0; display: flex;
    justify-content: center; align-items: center;
    font-size: 22px; font-weight: 800; color: #22d3ee;
    text-shadow: 0 0 15px rgba(34, 211, 238, 0.8);
  }
  .timer-text.warning { color: #f87171; animation: pulseWarn 0.5s infinite; }
  @keyframes pulseWarn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .question-box {
    background: linear-gradient(135deg, rgba(76, 29, 149, 0.6), rgba(30, 58, 138, 0.5));
    padding: 20px; border-radius: 20px; margin-bottom: 15px;
    border-right: 5px solid;
    border-image: linear-gradient(180deg, #fbbf24, #f472b6, #a855f7) 1;
    min-height: 90px; display: flex; align-items: center;
    font-size: 18px; line-height: 1.7; color: #f5f3ff;
  }
  .surprise-question {
    border-image: linear-gradient(180deg, #fbbf24, #ef4444, #fbbf24) 1 !important;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.3), rgba(239, 68, 68, 0.3)) !important;
    animation: surpriseGlow 1s infinite;
  }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .answers { grid-template-columns: 1fr; } }

  .answer-btn {
    padding: 15px 17px; font-size: 15px; border-radius: 16px; cursor: pointer;
    background: linear-gradient(135deg, rgba(76, 29, 149, 0.7), rgba(55, 48, 163, 0.7));
    color: #f0e9ff; border: 2px solid rgba(196, 181, 253, 0.3);
    transition: all 0.28s; text-align: right; font-family: inherit; font-weight: 500;
    position: relative; overflow: hidden;
  }
  .answer-btn::after {
    content: ''; position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: right 0.5s;
  }
  .answer-btn:hover:not(:disabled)::after { right: 100%; }
  .answer-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.9), rgba(79, 70, 229, 0.9));
    border-color: #c4b5fd; transform: translateX(-5px);
  }
  .answer-btn.correct {
    background: linear-gradient(135deg, #059669, #10b981, #34d399) !important;
    border-color: #6ee7b7 !important; color: #fff !important;
    animation: pulseCorrect 0.6s; box-shadow: 0 0 40px rgba(16, 185, 129, 0.9);
  }
  .answer-btn.wrong {
    background: linear-gradient(135deg, #991b1b, #dc2626, #f87171) !important;
    border-color: #fca5a5 !important; color: #fff !important;
    animation: shake 0.5s; box-shadow: 0 0 40px rgba(220, 38, 38, 0.9);
  }
  .answer-btn.eliminated { opacity: 0.25; text-decoration: line-through; pointer-events: none; }
  .answer-btn:disabled { cursor: not-allowed; opacity: 0.85; }

  @keyframes pulseCorrect {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  .feedback {
    text-align: center; font-size: 17px; margin-top: 12px;
    min-height: 28px; font-weight: bold; transition: all 0.3s;
  }

  .action-row {
    display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap;
  }

  .next-btn, .restart-btn, .help-btn, .pause-btn {
    padding: 13px 30px; font-size: 15px;
    border-radius: 16px; cursor: pointer; font-weight: bold; border: none;
    font-family: inherit; transition: all 0.35s;
  }
  .next-btn, .restart-btn {
    background: linear-gradient(135deg, #22d3ee, #a855f7, #f472b6, #fbbf24);
    background-size: 300% 100%;
    color: #0a0620;
    box-shadow: 0 10px 35px rgba(168, 85, 247, 0.6);
    animation: shimmer 3s linear infinite;
  }
  .next-btn:hover, .restart-btn:hover { transform: scale(1.07); }
  .help-btn {
    background: linear-gradient(135deg, #fbbf24, #f97316);
    color: #0a0620;
  }
  .help-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .pause-btn {
    background: linear-gradient(135deg, #6b7280, #374151);
    color: #fff;
  }

  .result-score {
    font-size: 66px; font-weight: 900; margin: 18px 0;
    background: linear-gradient(90deg, #fbbf24, #f472b6, #a855f7, #22d3ee);
    background-size: 400% 100%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; animation: rainbowText 4s linear infinite;
  }
  .result-msg { font-size: 18px; margin-bottom: 15px; line-height: 1.7; color: #e9d5ff; text-align: center; }

  .badges { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
  .badge {
    padding: 10px 15px; border-radius: 14px; font-size: 13px; font-weight: bold;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(244, 114, 182, 0.2));
    border: 2px solid rgba(251, 191, 36, 0.5); color: #fbbf24;
    animation: badgePop 0.5s ease;
  }
  @keyframes badgePop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .sound-toggle, .theme-toggle, .pause-toggle {
    position: fixed; z-index: 100;
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.9), rgba(34, 211, 238, 0.8));
    border: 2px solid rgba(196, 181, 253, 0.6); color: #fff;
    padding: 10px 14px; border-radius: 14px; cursor: pointer;
    font-size: 18px; backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .sound-toggle { top: 15px; left: 15px; }
  .theme-toggle { top: 15px; right: 15px; }
  .pause-toggle { top: 15px; left: 70px; display: none; }
  .sound-toggle:hover, .theme-toggle:hover, .pause-toggle:hover { transform: scale(1.1); }

  .star-burst {
    position: fixed; pointer-events: none; font-size: 40px;
    animation: starFly 1.2s ease-out forwards; z-index: 999;
  }
  @keyframes starFly {
    0% { transform: translate(0, 0) scale(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.5); opacity: 0; }
  }

  .coin-fly {
    position: fixed; pointer-events: none; font-size: 30px;
    animation: coinFly 1s ease-out forwards; z-index: 999;
  }
  @keyframes coinFly {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
  }

  /* نافذة الإحصائيات */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 500; display: none; justify-content: center; align-items: center;
    padding: 15px; backdrop-filter: blur(5px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(145deg, #1e0f3c, #0f0523);
    border: 2px solid rgba(168, 85, 247, 0.5); border-radius: 25px;
    padding: 25px; max-width: 500px; width: 100%;
    max-height: 85vh; overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
  }
  .modal h2 { color: #fbbf24; margin-bottom: 15px; text-align: center; }
  .modal .stat-line {
    display: flex; justify-content: space-between;
    padding: 10px 15px; margin-bottom: 8px;
    background: rgba(255,255,255,0.05); border-radius: 10px;
    font-size: 14px;
  }
  .modal .stat-line span:first-child { color: #c4b5fd; }
  .modal .stat-line span:last-child { color: #fbbf24; font-weight: bold; }
  .modal-close {
    display: block; margin: 15px auto 0; padding: 12px 30px;
    border-radius: 14px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    color: #0a0620; font-weight: bold; font-family: inherit;
    font-size: 15px;
  }

  /* قائمة الشارات */
  .badges-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-top: 15px;
  }
  .badge-card {
    padding: 15px; border-radius: 16px; text-align: center;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(196, 181, 253, 0.2);
    transition: all 0.3s;
  }
  .badge-card.unlocked {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(244, 114, 182, 0.15));
    border-color: #fbbf24;
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
  }
  .badge-card.locked { opacity: 0.4; }
  .badge-card .icon { font-size: 32px; margin-bottom: 6px; }
  .badge-card .name { font-size: 12px; color: #fbbf24; font-weight: bold; }
  .badge-card .desc { font-size: 10px; color: #c4b5fd; margin-top: 4px; }

  /* متجر */
  .shop-grid {
    display: grid; grid-template-columns: 1fr; gap: 12px;
  }
  .shop-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px; border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(196, 181, 253, 0.2);
  }
  .shop-item .info { flex: 1; }
  .shop-item .name { color: #fbbf24; font-weight: bold; margin-bottom: 4px; }
  .shop-item .desc { font-size: 12px; color: #c4b5fd; }
  .shop-buy {
    padding: 8px 16px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    color: #0a0620; font-weight: bold; font-family: inherit;
    font-size: 13px;
  }
  .shop-buy:disabled { opacity: 0.4; cursor: not-allowed; }

  /* نافذة المراجعة */
  .review-item {
    padding: 12px; margin-bottom: 10px; border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border-right: 4px solid #ef4444;
  }
  .review-item .q { color: #f5f3ff; font-size: 14px; margin-bottom: 6px; }
  .review-item .ans { color: #34d399; font-size: 13px; font-weight: bold; }

  /* تحدي يومي */
  .daily-banner {
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    color: #0a0620; padding: 12px 18px; border-radius: 14px;
    margin-bottom: 15px; font-weight: bold; text-align: center;
    animation: dailyShine 2s infinite;
  }
  @keyframes dailyShine {
    0%, 100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }
    50% { box-shadow: 0 0 35px rgba(251, 191, 36, 1); }
  }

  /* شخصيات */
  .chars-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0;
  }
  .char-card {
    padding: 15px 10px; border-radius: 16px; text-align: center;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(196, 181, 253, 0.2);
    cursor: pointer; transition: all 0.3s;
  }
  .char-card:hover { transform: translateY(-3px); }
  .char-card.selected {
    border-color: #fbbf24;

/* -------- مولّدات ذكية -------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function genGeneric(items, qFn, keyFn) {
  const out = [];
  items.forEach((item, idx) => {
    const correct = keyFn(item);
    const others = items.filter((_, i) => i !== idx).map(keyFn);
    const wrongs = shuffle(others).slice(0, 3);
    const options = shuffle([...wrongs, correct]);
    out.push({ q: qFn(item), a: options, c: options.indexOf(correct) });
  });
  return out;
}

function genMath(count = 800) {
  const out = [];
  const ops = ['+', '-', '×', '÷'];
  for (let i = 0; i < count; i++) {
    const op = ops[Math.floor(Math.random() * ops.length)];
    let a, b, r;
    if (op === '+') { a = Math.floor(Math.random()*100)+1; b = Math.floor(Math.random()*100)+1; r = a+b; }
    else if (op === '-') { a = Math.floor(Math.random()*100)+20; b = Math.floor(Math.random()*20)+1; r = a-b; }
    else if (op === '×') { a = Math.floor(Math.random()*12)+2; b = Math.floor(Math.random()*12)+2; r = a*b; }
    else { b = Math.floor(Math.random()*12)+2; r = Math.floor(Math.random()*12)+2; a = b*r; }
    const wrongs = new Set();
    while (wrongs.size < 3) {
      const o = Math.floor(Math.random()*10)-5;
      const w = r + (o === 0 ? 1 : o);
      if (w !== r && w > 0) wrongs.add(w);
    }
    const options = shuffle([...wrongs, r]);
    out.push({ q: `ما ناتج ${a} ${op} ${b}؟`, a: options.map(String), c: options.indexOf(r) });
  }
  return out;
}

let audioCtx = null, musicPlaying = false, musicTimeout = null, soundEnabled = true;
let currentMusicType = 'religious';

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function startMusic(type = 'religious') {
  if (!soundEnabled) return;
  stopMusic();
  initAudio();
  musicPlaying = true;
  currentMusicType = type;
  const religiousNotes = [261.63, 293.66, 311.13, 349.23, 392.00, 415.30, 466.16, 523.25,
                          466.16, 415.30, 392.00, 349.23, 311.13, 293.66, 261.63, 233.08];
  const scientificNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 329.63, 261.63,
                           293.66, 349.23, 440.00, 587.33, 523.25, 440.00, 392.00, 293.66];
  const notes = type === 'religious' ? religiousNotes : scientificNotes;
  let index = 0;
  function playNote() {
    if (!musicPlaying || !soundEnabled) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type === 'religious' ? 'sine' : 'triangle';
    osc.frequency.value = notes[index];
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.028, audioCtx.currentTime + 0.4);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 2.2);
    index = (index + 1) % notes.length;
    musicTimeout = setTimeout(playNote, 1500);
  }
  playNote();
}
function stopMusic() {
  musicPlaying = false;
  if (musicTimeout) clearTimeout(musicTimeout);
}
function playCorrect() {
  if (!soundEnabled) return; initAudio();
  [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    const t = audioCtx.currentTime + i * 0.1;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.5);
  });
}
function playWrong() {
  if (!soundEnabled) return; initAudio();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(220, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}
function playTick() {
  if (!soundEnabled) return; initAudio();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}
function playFinish() {
  if (!soundEnabled) return; initAudio();
  [523.25, 587.33, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    const t = audioCtx.currentTime + i * 0.15;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.6);
  });
}
function playStreak() {
  if (!soundEnabled) return; initAudio();
  [659.25, 783.99, 987.77, 1174.66].forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.value = f;
    const t = audioCtx.currentTime + i * 0.08;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.12, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.3);
  });
}
function playCoin() {
  if (!soundEnabled) return; initAudio();
  [1318.51, 1567.98].forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    const t = audioCtx.currentTime + i * 0.08;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.1, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.2);
  });
}

/* -------- حالة اللعبة -------- */
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let correctCount = 0;
let answered = false;
let timerInterval = null;
let timeLeft = 25;
let QUESTION_TIME = 25;
let QUESTIONS_PER_ROUND = 25;
let selectedCategory = 'religious';
let selectedDifficulty = 'easy';
let selectedChar = 'wise';
let streak = 0, maxStreak = 0;
let helpRemaining = 3, timeHelpRemaining = 1;
let paused = false;
let isSurpriseQuestion = false;
let missedQuestions = [];

/* -------- بيانات اللاعب -------- */
let player = {
  name: 'لاعب',
  coins: 0,
  xp: 0,
  level: 1,
  badges: [],
  totalGames: 0,
  totalScore: 0,
  bestScore: 0
};

function loadPlayer() {
  try {
    const saved = JSON.parse(localStorage.getItem('noorPlayer') || '{}');
    player = { ...player, ...saved };
    if (player.badges === undefined) player.badges = [];
  } catch(e) {}
  updatePlayerUI();
}
function savePlayer() {
  try { localStorage.setItem('noorPlayer', JSON.stringify(player)); } catch(e) {}
}
function updatePlayerUI() {
  const el = document.getElementById('xpName');
  if (el) el.textContent = `${player.name} • Lv.${player.level}`;
  const xf = document.getElementById('xpFill');
  if (xf) xf.style.width = (player.xp % 100) + '%';
  const cd = document.getElementById('coinsDisplay');
  if (cd) cd.textContent = player.coins;
}

/* -------- بدء -------- */
function selectCategory(cat) {
  selectedCategory = cat;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  startMusic(cat);
  startGame();
}

function selectDiff(diff, btn) {
  selectedDifficulty = diff;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (diff === 'easy') QUESTION_TIME = 25;
  else if (diff === 'medium') QUESTION_TIME = 15;
  else if (diff === 'hard') QUESTION_TIME = 10;
  else if (diff === 'expert') QUESTION_TIME = 7;
  else if (diff === 'legend') QUESTION_TIME = 5;
}

function selectChar(c, el) {
  selectedChar = c;
  document.querySelectorAll('.char-card').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function startGame() {
  const nameInput = document.getElementById('playerName').value.trim();
  if (nameInput) player.name = nameInput;
  savePlayer();

  const all = selectedCategory === 'religious' ? getAllReligious() : getAllScientific();
  currentQuestions = shuffle(all).slice(0, QUESTIONS_PER_ROUND);
  currentIndex = 0; score = 0; correctCount = 0; streak = 0; maxStreak = 0;
  missedQuestions = [];
  helpRemaining = selectedChar === 'explorer' ? 5 : 3;
  timeHelpRemaining = 1;

  showScreen('gameScreen');
  document.getElementById('pauseToggle').style.display = 'block';
  updateHelpButtons();
  showQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showQuestion() {
  answered = false; paused = false;
  const q = currentQuestions[currentIndex];
  const total = currentQuestions.length;

  isSurpriseQuestion = Math.random() < 0.08;

  document.getElementById('qNum').textContent = `${currentIndex + 1}/${total}`;
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = Math.floor(correctCount / 5) + 1;
  document.getElementById('streak').textContent = streak;
  document.getElementById('progress').style.width = ((currentIndex / total) * 100) + '%';
  document.getElementById('questionText').textContent = (isSurpriseQuestion ? '🎪 سؤال مفاجأة! ' : '') + q.q;
  document.getElementById('questionText').className = 'question-box flash-question' + (isSurpriseQuestion ? ' surprise-question' : '');
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('surpriseBox').style.display = isSurpriseQuestion ? 'block' : 'none';

  const sb = document.getElementById('streakBox');
  if (streak >= 3) sb.classList.add('hot'); else sb.classList.remove('hot');

  const box = document.getElementById('answersBox');
  box.innerHTML = '';
  q.a.forEach((answer, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = answer;
    btn.onclick = () => checkAnswer(i, btn);
    box.appendChild(btn);
  });

  let t = QUESTION_TIME;
  if (selectedChar === 'warrior') t += 5;
  startTimer(t);
}

function startTimer(t) {
  stopTimer();
  timeLeft = t;
  QUESTION_TIME = t;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (paused) return;
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 5 && timeLeft > 0) playTick();
    if (timeLeft <= 0) { stopTimer(); timeOut(); }
  }, 1000);
}
function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

function updateTimerDisplay() {
  const c = document.getElementById('timerCircle');
  const t = document.getElementById('timerText');
  const circ = 251.2;
  c.style.strokeDashoffset = circ * (1 - timeLeft / QUESTION_TIME);
  t.textContent = timeLeft;
  if (timeLeft <= 5) t.classList.add('warning'); else t.classList.remove('warning');
}

function timeOut() {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentIndex];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);
  btns[q.c].classList.add('correct');
  document.getElementById('feedback').textContent = `⏰ انتهى الوقت! الصحيح: ${q.a[q.c]}`;
  document.getElementById('feedback').style.color = '#fbbf24';
  playWrong(); streak = 0;
  document.getElementById('streak').textContent = streak;
  missedQuestions.push(q);
  document.getElementById('nextBtn').style.display = 'block';
}

function checkAnswer(selected, btn) {
  if (answered) return;
  answered = true;
  stopTimer();
  const q = currentQuestions[currentIndex];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');

  if (selected === q.c) {
    btn.classList.add('correct');
    streak++;
    if (streak > maxStreak) maxStreak = streak;
    const timeBonus = Math.max(0, timeLeft);
    let mult = streak >= 5 ? 3 : streak >= 3 ? 2 : 1;
    if (isSurpriseQuestion) mult *= 5;
    if (selectedChar === 'wise') mult *= 1.2;
    const pts = Math.round((10 + timeBonus) * mult);
    score += pts; correctCount++;
    const earned = isSurpriseQuestion ? 5 : 1;
    player.coins += earned;
    fb.textContent = `✅ صحيح! +${pts} نقطة 💰+${earned}${mult > 1 ? ` (×${mult})` : ''}`;
    fb.style.color = '#34d399';
    playCorrect();
    if (streak >= 3) playStreak();
    if (isSurpriseQuestion) playCoin();
    createStarBurst(btn);
    createCoinFly(btn);
    savePlayer(); updatePlayerUI();
  } else {
    btn.classList.add('wrong');
    btns[q.c].classList.add('correct');
    fb.textContent = `❌ خطأ. الصحيح: ${q.a[q.c]}`;
    fb.style.color = '#f87171';
    playWrong(); streak = 0;
    missedQuestions.push(q);
  }

  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = Math.floor(correctCount / 5) + 1;
  document.getElementById('streak').textContent = streak;
  const sb = document.getElementById('streakBox');
  if (streak >= 3) sb.classList.add('hot'); else sb.classList.remove('hot');
  document.getElementById('nextBtn').style.display = 'block';
}

function createStarBurst(btn) {
  const r = btn.getBoundingClientRect();
  const stars = ['⭐','✨','💫','🌟'];
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'star-burst';
    s.textContent = stars[Math.floor(Math.random()*stars.length)];
    s.style.left = r.left + r.width/2 + 'px';
    s.style.top = r.top + r.height/2 + 'px';
    const a = (Math.PI * 2 * i) / 6;
    s.style.setProperty('--dx', Math.cos(a)*150 + 'px');
    s.style.setProperty('--dy', Math.sin(a)*150 + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

function createCoinFly(btn) {
  const r = btn.getBoundingClientRect();
  const c = document.createElement('div');
  c.className = 'coin-fly';
  c.textContent = '💰';
  c.style.left = r.left + r.width/2 + 'px';
  c.style.top = r.top + 'px';
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 1000);
}

function useHelp() {
  if (answered || helpRemaining <= 0 || paused) return;
  const q = currentQuestions[currentIndex];
  const btns = document.querySelectorAll('.answer-btn');
  const wrongs = [];
  btns.forEach((b, i) => { if (i !== q.c) wrongs.push(i); });
  shuffle(wrongs).slice(0, 2).forEach(i => {
    btns[i].classList.add('eliminated');
    btns[i].disabled = true;
  });
  helpRemaining--;
  updateHelpButtons();
}
function useTimeHelp() {
  if (answered || timeHelpRemaining <= 0 || paused) return;
  timeLeft += 10;
  QUESTION_TIME = Math.max(QUESTION_TIME, timeLeft);
  updateTimerDisplay();
  timeHelpRemaining--;
  updateHelpButtons();
}
function updateHelpButtons() {
  document.getElementById('helpCount').textContent = helpRemaining;
  document.getElementById('timeCount').textContent = timeHelpRemaining;
  document.getElementById('helpBtn').disabled = helpRemaining <= 0;
  document.getElementById('timeBtn').disabled = timeHelpRemaining <= 0;
}

function nextQuestion() {
  stopTimer();
  currentIndex++;
  if (currentIndex >= currentQuestions.length) endGame();
  else showQuestion();
}

function endGame() {
  stopTimer();
  document.getElementById('pauseToggle').style.display = 'none';
  showScreen('resultScreen');

  const total = currentQuestions.length;
  const percent = Math.round((correctCount / total) * 100);
  document.getElementById('finalScore').textContent = `${score} نقطة`;
  let msg = '';
  if (percent >= 90) msg = `🌟 ممتاز! أجبت على ${correctCount} من ${total} (${percent}%).`;
  else if (percent >= 70) msg = `👏 جيد جداً! أجبت على ${correctCount} من ${total} (${percent}%).`;
  else if (percent >= 50) msg = `🙂 جيد. أجبت على ${correctCount} من ${total} (${percent}%).`;
  else msg = `💪 تحتاج مراجعة. أجبت على ${correctCount} من ${total} (${percent}%).`;
  document.getElementById('resultMsg').textContent = msg;

  // شارات
  const badges = [];
  if (percent === 100) badges.push('🏆 مثالي');
  if (percent >= 90) badges.push('🥇 محترف');
  if (maxStreak >= 5) badges.push('🔥 سلسلة نارية');
  if (maxStreak >= 10) badges.push('⚡ أسطوري');
  if (score >= 500) badges.push('💰 جامع النقاط');
  if (score >= 1000) badges.push('💎 مليونير');
  if (correctCount >= 20) badges.push('🎯 قناص');
  if (helpRemaining === 3) badges.push('🦸 بلا مساعدة');
  if (missedQuestions.length === 0) badges.push('💯 بلا خطأ');
  if (selectedDifficulty === 'legend') badges.push('👑 أسطورة');
  if (selectedCategory === 'religious') badges.push('🕌 عالم دين');
  else badges.push('🔬 عالم علوم');

  badges.forEach(b => { if (!player.badges.includes(b)) player.badges.push(b); });

  // XP
  player.xp += Math.floor(score / 10);
  const newLevel = Math.floor(player.xp / 100) + 1;
  if (newLevel > player.level) player.level = newLevel;
  player.totalGames++;
  player.totalScore += score;
  if (score > player.bestScore) player.bestScore = score;

  // صناديق مكافآت
  const boxCoins = Math.floor(Math.random() * 20) + 5;
  player.coins += boxCoins;
  savePlayer();
  updatePlayerUI();

  document.getElementById('badgesBox').innerHTML =
    badges.map(b => `<div class="badge">${b}</div>`).join('') +
    `<div class="badge" style="background:linear-gradient(135deg,#fbbf24,#ec4899);color:#0a0620;">🎁 صندوق مكافأة: +${boxCoins} 💰</div>`;

  saveScore(score, percent);
  playFinish();
}

function backToStart() {
  stopTimer(); paused = false;

    arr.push({ score: s, percent: p, name: player.name, date: new Date().toLocaleDateString('ar-EG') });

    arr = arr.slice(0, 5);

      </div>`).join('');
  } catch(e) {}
}

}

let shopItems = [
  { id: 'help1', name: '💡 مساعدة إضافية', desc: '50:50 إضافية', price: 20 },
  { id: 'time1', name: '⏱️ وقت إضافي', desc: '+10 ثواني إضافية', price: 15 },
  { id: 'name_change', name: '📝 تغيير الاسم', desc: 'فرصة لتغيير اسمك', price: 5 }
];

function openShop() {
  openModal(`
    <h2>🛒 المتجر - 💰 ${player.coins}</h2>
    <div class="shop-grid">
      ${shopItems.map(it => `
        <div class="shop-item">
          <div class="info">
            <div class="name">${it.name}</div>
            <div class="desc">${it.desc}</div>
          </div>
          <button class="shop-buy" ${player.coins < it.price ? 'disabled' : ''} onclick="buyItem('${it.id}')">💰 ${it.price}</button>
        </div>
      `).join('')}
    </div>
    <button class="modal-close" onclick="closeModal()">إغلاق</button>
  `);
}
function buyItem(id) {
  const it = shopItems.find(x => x.id === id);
  if (!it || player.coins < it.price) return;
  player.coins -= it.price;
  if (id === 'help1') helpRemaining += 2;
  else if (id === 'time1') timeHelpRemaining += 2;
  else if (id === 'name_change') { const n = prompt('الاسم الجديد:'); if (n) player.name = n.trim(); }
  savePlayer(); updatePlayerUI(); playCoin();
  openShop();
  alert('✅ تم الشراء بنجاح!');
}

function openDaily() {
  const today = new Date().toDateString();
  const lastPlayed = localStorage.getItem('lastDaily');
  const canPlay = lastPlayed !== today;
  openModal(`
    <h2>🎁 التحدي اليومي</h2>
    <p style="text-align:center;margin:15px 0;color:#e9d5ff;">
      ${canPlay ? 'تحدي اليوم متاح! 10 أسئلة بمكافأة مضاعفة 💰' : '✅ أكملت تحدي اليوم. عد غداً!'}
    </p>
    ${canPlay ? '<button class="modal-close" onclick="startDaily()">▶️ ابدأ التحدي</button>' : ''}
    <button class="modal-close" onclick="closeModal()" style="background:linear-gradient(135deg,#6b7280,#374151);color:#fff;">إغلاق</button>
  `);
}
function startDaily() {
  closeModal();
  localStorage.setItem('lastDaily', new Date().toDateString());
  player.coins += 50;
  savePlayer(); updatePlayerUI();
  alert('🎁 حصلت على 50 عملة! ابدأ اللعب الآن.');
  selectCategory('religious');
}

function openReview() {
  const missed = JSON.parse(localStorage.getItem('missedQs') || '[]');
  if (!missed.length) {
    openModal(`<h2>📚 مراجعة الأخطاء</h2><p style="text-align:center;margin:20px 0;color:#c4b5fd;">لا توجد أخطاء محفوظة. أحسنت! 🎉</p><button class="modal-close" onclick="closeModal()">إغلاق</button>`);
    return;
  }
  openModal(`
    <h2>📚 مراجعة الأخطاء (${missed.length})</h2>
    ${missed.slice(0, 20).map(m => `
      <div class="review-item">
        <div class="q">❓ ${m.q}</div>
        <div class="ans">✅ ${m.ans}</div>
      </div>
    `).join('')}
    <button class="modal-close" onclick="closeModal()">إغلاق</button>
  `);
}

function shareResult() {
  const text = `🎮 لعبت نور العقل وحصلت على ${score} نقطة! جربها أنت أيضاً!`;
  if (navigator.share) navigator.share({ text });
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert('✅ تم نسخ النتيجة!'));
  else alert(text);
}

/* -------- الثيمات -------- */
const themes = ['royal', 'ocean', 'sunset', 'forest', 'galaxy'];
let themeIndex = 0;
document.getElementById('themeToggle').onclick = () => {
  themeIndex = (themeIndex + 1) % themes.length;
  document.body.className = 'theme-' + themes[themeIndex];
  localStorage.setItem('theme', themes[themeIndex]);
};

/* -------- الصوت -------- */
document.getElementById('soundToggle').onclick = function() {
  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    startMusic(selectedCategory);
  } else stopMusic();
};

document.body.addEventListener('click', function once() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  document.body.removeEventListener('click', once);
}, { once: true });

/* -------- تهيئة -------- */
const savedTheme = localStorage.getItem('theme');
if (savedTheme) { document.body.className = 'theme-' + savedTheme; themeIndex = themes.indexOf(savedTheme); }
loadPlayer();
loadLeaderboard();

// عرض التحدي اليومي إذا متاح
if (localStorage.getItem('lastDaily') !== new Date().toDateString()) {
  document.getElementById('dailyChallengeBanner').style.display = 'block';
}
</script>
